  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/app/app.css">
  <!-- Tiny and blocking on purpose: phones leave for the store before the first paint. -->
  <script src="/app/redirect.js"></script>
  <script data-goatcounter="https://swordistudios.goatcounter.com/count" async src="/count.js"></script>
</head>
